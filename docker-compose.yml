name: signal-signage

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - signage

  api:
    build:
      context: ./api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://signage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/signage
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      BACKUP_ROOT: /data/backups
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - media_data:/data/media
      - backup_data:/data/backups
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - signage

  worker:
    build:
      context: ./api
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql://signage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/signage
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      BACKUP_ROOT: /data/backups
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    volumes:
      - media_data:/data/media
      - backup_data:/data/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - signage

  pi:
    build:
      context: ./pi
    restart: unless-stopped
    environment:
      SIGNAL_API_URL: http://api:8000/api/v1
      SIGNAL_STATE_DIR: /var/lib/signal-player
      SIGNAL_START_CHROMIUM: "true"
    volumes:
      - pi_state:/var/lib/signal-player
    ports:
      - "${PI_PORT:-8090}:8090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - signage

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: signage
      POSTGRES_USER: signage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage -d signage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signage

  cloudflared:
    image: cloudflare/cloudflared:2026.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      web:
        condition: service_started
    networks:
      - signage

volumes:
  postgres_data:
  redis_data:
  media_data:
  backup_data:
  pi_state:

networks:
  signage:
    driver: bridge
